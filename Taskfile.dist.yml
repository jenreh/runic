# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

includes:
  qa:
    taskfile: ./taskfiles/Taskfile.qa.yml
    flatten: true
    vars:
      PROJECT: "{{.PROJECT}}"
  graphdb: ./taskfiles/Taskfile.graphdb.yml
  release: ./taskfiles/Taskfile.release.yml
  docs:
    taskfile: ./taskfiles/Taskfile.docs.yml
    dir: .

silent: true

vars:
  PROJECT: runic

tasks:
  default:
    desc: Show available commands
    cmd: task --list

  # ----------------------------------------------------------------------------
  # Project Initialization and Dependency Management
  # ----------------------------------------------------------------------------

  init:
    desc: Initialize project (install python, sync deps, setup pre-commit)
    vars:
      PYTHON_VERSION:
        sh: |
          grep 'requires-python' pyproject.toml | sed -E 's/.*>=?([0-9]+\.[0-9]+).*/\1/'
    cmds:
      - echo "🐍 Installing Python {{.PYTHON_VERSION}}..."
      - uv python install {{.PYTHON_VERSION}}
      - uv python pin {{.PYTHON_VERSION}}
      - echo "📦 Syncing dependencies..."
      - uv sync --all-groups
      - echo "🔒 Installing pre-commit hooks..."
      - uv tool list | grep -q pre-commit || uv tool install pre-commit
      - uv run pre-commit install

  install:
    desc: Install all dependencies (including dev extras)
    cmd: uv sync --all-groups

  sync:
    desc: Install dependencies using uv
    cmd: uv sync --all-groups

  clean:
    desc: Clean cache and build artifacts
    ignore_error: true
    cmds:
      - rm -rf __pycache__/ .cache/ .state/ .web/ dist/ build/ coverage.xml .coverage
      - find . -type d -name "__pycache__" -exec rm -rf {} +
      - find . -type f -name "*.pyc" -delete

  # ----------------------------------------------------------------------------
  # PyPI Publishing Commands (Namespace: publish)
  # ----------------------------------------------------------------------------

  release:publish:
    desc: Build and publish all library modules whose version is not on PyPI yet
    cmds:
      - task: publish-package
        vars: { NAME: runic-py, DIR: . }
      - task: publish-package
        vars: { NAME: runic-rag-docling, DIR: packages/runic-rag-docling }
      - echo "✅ All modules published successfully"

  publish-package:
    internal: true
    dir: "{{.DIR}}"
    cmds:
      - |
        VERSION=$(grep '^version = ' pyproject.toml | cut -d '"' -f2)
        STATUS=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/{{.NAME}}/$VERSION/json")
        case "$STATUS" in
          200) echo "⏭️  {{.NAME}} $VERSION is already on PyPI, skipping" ;;
          404) uv build --clear && uv publish ;;
          *) echo "❌ PyPI returned HTTP $STATUS for {{.NAME}} $VERSION" >&2; exit 1 ;;
        esac
